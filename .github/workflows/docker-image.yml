# 2026-08-09 前端容器构建管线（迁移阿里云）。产物为 ECS 专用镜像：
# rewrite 目标 build 期固化为 127.0.0.1:3100（同机后端，--network host 运行）。
# Vercel 部署不使用本镜像，互不影响。NEXT_PUBLIC_* 均为浏览器公开值非机密；
# NEXT_PUBLIC_YAHOO_DEPOSIT_RECHARGE_PAGE_PATH 是小程序页面路径（雅虎押金充值页），非密钥。
name: docker-image
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: lowercase repo name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            KANGAROO_JAPAN_BACKEND_ORIGIN=http://127.0.0.1:3100
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_live_51TMP6J8yr16GNKWrZxEF2Ua9G8qS7YYQzW1mZyApw4AF01egVohDf51qP4FYLjo97icIQMPdhtv9O7pCW9RL6Vhi00rJ4pAC99
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=0x4AAAAAADngdkigXwrrNQsC
            NEXT_PUBLIC_YAHOO_DEPOSIT_RECHARGE_PAGE_PATH=/pages/daishujun/mine/deposit
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
