name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # next-intl 内嵌 @swc/core 的 peer 与 next 16.2.4 锁定版本冲突,npm ci 严格模式会报
        # Missing: @swc/helpers 失败;与 Dockerfile(1f6a185)同法用 --legacy-peer-deps 按 lock 安装
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://kangaroo-japan-backend.vercel.app/api/v1
          NEXT_PUBLIC_SITE_URL: https://jp-buy.com
